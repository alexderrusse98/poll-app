<div class="filter-btns">
    <button (click)="activeTab.set('active')">Active</button>
    <button (click)="activeTab.set('past')">Past</button>
</div>
<select name="" id="">
    <option (click)="selectedCategory.set('all')" value="">Alle</option>
    @for (cat of availableCategories(); track cat) {
    <option (click)="selectedCategory.set(cat)" value="">{{cat}}</option>
    }
</select>

<table>
    <tbody>
        @for (item of filteredSurveys(); track $index) {
        <tr>
            <td>{{item.category}}</td>
            <h2>
                <td>{{item.name}}</td>
            </h2>
            <td>Datum: {{item.end_date}} </td>
        </tr>


        }
    </tbody>
</table>
